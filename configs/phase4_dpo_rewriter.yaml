# Phase 4 — Qwen3-Embedding-0.6B + ROPG-KD retriever + DPO-trained rewriter (full system).
seed: 42

knowledge_base:
  # Use the ROPG-KD fine-tuned encoder for inference. Point index_path at the
  # rebuilt index (after running ropg_kd.py and re-indexing with the KD checkpoint).
  # For preference-pair generation, the phase1 index is used (pre-KD, same corpus).
  index_path: data/index/phase3_ropg_kd.faiss
  meta_path: data/index/phase3_ropg_kd_meta.json

embedder:
  model: Qwen/Qwen3-Embedding-0.6B
  # After ROPG-KD: set adapter_path to the saved LoRA checkpoint.
  adapter_path: data/rl/ropg_kd_checkpoints/ropg_kd_best
  device: cuda
  batch_size: 32
  max_seq_length: 2048  # must match configs/train_ropg.yaml embedder.max_seq_length

chunking:
  chunk_size: 800
  chunk_overlap: 150

retrieval:
  top_k: 5

# ── Preference pairs (generated by notebooks/gen_dpo_data.ipynb or src/data/gen_dpo_data.py) ──
preference_pairs:
  output_path: data/dpo/train.jsonl   # written by the proxy-judge datagen pipeline
  val_path: data/dpo/val.jsonl

# ── DPO training (run on Kaggle/GPU after pairs are generated) ────────────────
dpo:
  checkpoint_dir: data/rl/dpo_rewriter_checkpoints    # gitignored
  model: Qwen/Qwen3-4B                                  # HuggingFace model ID
  device: cuda
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 4
  lr: 5.0e-5
  beta: 0.1             # DPO temperature; higher = closer to reference
  val_fraction: 0.1
  max_length: 256
  max_prompt_length: 200
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_target_modules: ["q_proj", "v_proj"]

llm:
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 800
  prompt_variant: en

rewriter:
  enabled: true
  type: dpo
  model: Qwen/Qwen3-4B
  adapter_path: data/rl/dpo_rewriter_checkpoints/dpo_best
  device: cuda
  max_new_tokens: 200
