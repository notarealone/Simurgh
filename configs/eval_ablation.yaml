# Held-out ablation: five arms on the held-out question split, all four personas.
data:
  questions_dir: data/questions
  test_qids_path: data/splits/test_qids.txt
  corpus_path: data/chunks/corpus.jsonl
output_dir: results/ablation
# All four profiles in personalization.profiles.PERSONAS. `newcomer` is the persona held out
# of training; the other three are seen personas on unseen questions. Drop entries here to
# shrink the run — every expected count is derived from this list.
personas: [crammer, newcomer, scholar, steady]
# Repetitions of the identical remote calls. Not seeds: no endpoint here exposes a verified
# deterministic seed contract, so these measure endpoint sampling variance only. One
# replicate means the run makes no variance claim. Widening to [1, 2, 3] triples the remote
# bill and needs no code change; the notebook exposes REPLICATES_OVERRIDE for the same edit.
replicates: [1]

embedder:
  model_name: Qwen/Qwen3-Embedding-0.6B
  # Must equal embedder.max_seq_length in configs/train_ropg.yaml.
  max_seq_length: 2048
  fp16: true
  batch_size: 16

rewriter:
  model_name: Qwen/Qwen3-4B
  max_seq_length: 768
  batch_size: 8
  generation:
    max_new_tokens: 224
    do_sample: false

# Local paths for the CLI route. The Kaggle notebook overrides both from its knobs cell.
# The rewriter is the `wpo` arm: it is the promoted one, per docs/results/dpo-arms-seed42-v2.md.
artifacts:
  ropg_adapter_path: models/ropg/ropg_kd_runB_model/ropg_kd_checkpoints/checkpoint-best
  dpo_adapter_path: models/dpo/dpo-seed-42/runs/wpo/seed-42/dpo_best

# Baseline ladder, one rung per arm. `profile: false` strips the learner profile from both
# the retrieval instruction and the answer prompt; the judge always receives it.
arms:
  - {name: base_embedder_no_profile,       embedder: base,  profile: false, rewriter: none}
  - {name: base_embedder,                  embedder: base,  profile: true,  rewriter: none}
  - {name: trained_embedder,               embedder: ropg,  profile: true,  rewriter: none}
  - {name: trained_embedder_base_rewriter, embedder: ropg,  profile: true,  rewriter: base}
  - {name: trained_embedder_rewriter,      embedder: ropg,  profile: true,  rewriter: dpo}

retrieval:
  top_k: 5

generator:
  model: deepseek-v4-flash
  temperature: 0.2
  max_completion_tokens: 1024
  retry: {max_attempts: 3, initial_backoff_seconds: 1.0, backoff_multiplier: 2.0, max_backoff_seconds: 8.0}

judges:
  # Primary. Also labelled the DPO preference pairs, so arm-5 numbers are not judge-independent
  # on this judge alone — that is what the secondary judge is for.
  primary:
    model: gpt-5.6-luna
    reasoning_effort: low
    temperature: 1.0
    # Covers hidden low-effort reasoning plus the small JSON reply.
    max_completion_tokens: 2048
    retry: {max_attempts: 3, initial_backoff_seconds: 1.0, backoff_multiplier: 2.0, max_backoff_seconds: 8.0}
  # Secondary. Independent of the pair labeller and of the ROPG teacher. Flash-lite rather
  # than the pricier gemini-3.7-flash: on 89 paired keys the two agree with Luna at
  # indistinguishable rates (McNemar p = 0.541, docs/results/judge-agreement-luna-gemini-v1.md),
  # so the cheaper model buys the same signal.
  secondary:
    model: gemini-3.5-flash-lite
    # This model's floor, and verified to parse at max_output_tokens 512. Thinking tokens
    # draw from the same budget: `medium` and `high` spend it before the JSON closes and
    # come back as an unterminated string.
    thinking_level: minimal
    temperature: 0.0
    max_output_tokens: 512
    # Five attempts, not three: the Metis Gemini route emits intermittent nginx 504s (3 of
    # 9 probe calls). A secondary failure does not fail the row, it drops that row out of
    # judge_agreement.csv, so the extra attempts protect coverage rather than the run.
    retry: {max_attempts: 5, initial_backoff_seconds: 1.0, backoff_multiplier: 2.0, max_backoff_seconds: 16.0}

execution:
  # Concurrent in-flight remote requests per rank; 16 across two T4s.
  max_workers: 8
  bootstrap_samples: 5000
  bootstrap_seed: 42
