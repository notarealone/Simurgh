# Phase 3 — Qwen3-Embedding-0.6B + ROPG-KD trained retriever, untrained rewriter.
seed: 42

knowledge_base:
  index_path: data/index/phase3.faiss
  meta_path: data/index/phase3_meta.json

embedder:
  model: Qwen/Qwen3-Embedding-0.6B
  device: cpu      # inference-side retriever; change to "cuda" if available
  batch_size: 32
  max_seq_length: 2048  # must match configs/train_ropg.yaml embedder.max_seq_length
  adapter_path: data/rl/ropg_kd_checkpoints/best  # set to null for the untrained Rung-1 encoder

chunking:
  chunk_size: 800
  chunk_overlap: 150

retrieval:
  top_k: 5

llm:
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 800
  prompt_variant: en

rewriter:
  enabled: false   # Phase 3 uses the untrained (prompted) rewriter at inference
