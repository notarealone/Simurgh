[project]
name = "simurgh"
version = "0.1.0"
description = "Optimizing RAG systems with Reinforcement Learning for personalization"
readme = "README.md"
requires-python = "~=3.11.15"
license = { text = "MIT" }
authors = [
    { name = "Alireza Hosseini" },
]

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: each src/<pkg> installs as a top-level import (rag, rl, personalization, data)
packages = ["src/rag", "src/rl", "src/personalization", "src/data"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
src = ["src", "benchmarks", "app"]

line-length = 99
indent-width = 4

# Exclude directories from linting
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely bugs & design problems)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking (move type-only imports under TYPE_CHECKING)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["rag", "rl", "personalization", "data"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── UV ─────────────────────────────────────────────────────────────────────────

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
