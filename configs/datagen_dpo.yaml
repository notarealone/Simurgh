rewriter:
  model: grok-4-1-fast
  # Three samples per (question, persona), spanning the previous range's cold and warm
  # ends. Four temperatures bought density inside the range, not width, and every extra
  # temperature costs one rewrite call plus one judge call per persona.
  temperatures: [0.2, 0.5, 0.9]
  # Measured over the existing pairs: rewrites run 36 tokens on average (p90 52, max 137),
  # so 300 is headroom, not a binding cap.
  max_completion_tokens: 300
  max_workers: 4
  # Retry API exceptions and empty completions with exponential, capped backoff;
  # exhaustion drops that single candidate rather than scoring it.
  max_attempts: 3
  initial_backoff_seconds: 1.0
  backoff_multiplier: 2.0
  max_backoff_seconds: 8.0

judge:
  model: gpt-5.6-luna
  # Luna is a reasoning model: with reasoning enabled, reasoning tokens consume the
  # 16-token completion budget and the response comes back empty. Same setting as
  # configs/datagen_ropg.yaml.
  reasoning_effort: none
  temperature: 1.0
  max_completion_tokens: 16
  # Retry API exceptions and malformed numeric responses with exponential, capped
  # backoff; exhaustion drops the candidate instead of assigning score zero.
  max_attempts: 3
  initial_backoff_seconds: 1.0
  backoff_multiplier: 2.0
  max_backoff_seconds: 8.0

cross_persona_threshold: 0.25

data:
  questions_dir: data/questions
  splits_dir: data/splits
  output_dir: data/dpo

seed: 42
