[project]
name = "simurgh"
version = "0.1.0"
description = "Optimizing RAG systems with Reinforcement Learning for personalization"
readme = "README.md"
requires-python = "~=3.11.15"
license = { text = "MIT" }
authors = [
    { name = "Alireza Hosseini" },
]

dependencies = [
    "hazm>=0.10.0",
    "litellm>=1.91.0",
    "openai>=2.41.1",
    "pypdf>=6.13.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentence-transformers==5.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "ipykernel>=6.0",
]
# Dense retrieval (BGE-M3 + FAISS). Not installed by default because sentence-transformers
# pulls torch (~2GB with CUDA on Linux). On Kaggle torch is pre-installed; install this
# extra there with: uv sync --extra embedding
# Local smoke-tests that need embeddings: uv sync --extra embedding (CPU torch only).
embedding = [
    "faiss-cpu>=1.8.0.post1",
    "sentence-transformers==5.6.0",
]
# LoRA adapter training (ROPG-KD retriever + DPO rewriter). Runs on Kaggle/GPU.
# Install with: uv sync --extra training  (combine with --extra embedding for full setup)
training = [
    "peft>=0.15.0",
    "tqdm>=4.67.0",
    "trl>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: each src/<pkg> installs as a top-level import (rag, rl, personalization, data)
packages = ["src/rag", "src/rl", "src/personalization", "src/data"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
src = ["src", "benchmarks", "app"]

line-length = 99
indent-width = 4

# Exclude directories from linting
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely bugs & design problems)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking (move type-only imports under TYPE_CHECKING)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    # Persian is a first-class language here; ambiguous-unicode checks fire on
    # nearly every Persian string (e.g. ARABIC ALEF vs LATIN l) as false positives.
    "RUF001",  # ambiguous char in string
    "RUF002",  # ambiguous char in docstring
    "RUF003",  # ambiguous char in comment
]

[tool.ruff.lint.isort]
known-first-party = ["rag", "rl", "personalization", "data"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── UV ─────────────────────────────────────────────────────────────────────────

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

# PyTorch CPU-only wheels (local dev has no GPU; Kaggle provides its own torch).
# sentence-transformers depends on torch; this pins it to the CPU variant so uv
# does not pull down 2GB+ of CUDA packages on a CPU-only machine.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
