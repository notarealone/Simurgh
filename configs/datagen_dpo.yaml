rewriter:
  model: grok-4-1-fast
  temperatures: [0.2, 0.5, 0.8, 1.2]
  max_completion_tokens: 300
  max_workers: 16

judge:
  model: gpt-5.4-nano
  temperature: 1.0
  max_completion_tokens: 16

cross_persona_threshold: 0.25

data:
  questions_dir: data/questions
  splits_dir: data/splits
  output_dir: data/dpo

seed: 42
