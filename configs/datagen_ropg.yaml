embedder:
  model: Qwen/Qwen3-Embedding-0.6B
  device: cpu
  batch_size: 128

retriever:
  top_k: 20

judge:
  model: gpt-5.4-nano
  temperature: 1.0
  max_completion_tokens: 16
  max_workers: 8

data:
  chunks: data/chunks/corpus.jsonl
  questions_dir: data/questions
  splits_dir: data/splits
  output_dir: data/ropg_kd

seed: 42
