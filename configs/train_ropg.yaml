# Stage-1 training: ROPG-KD fine-tunes the Qwen3-Embedding-0.6B retriever via a LoRA
# adapter, distilling LLM-judge teacher scores. Data comes from
# notebooks/gen_ropg_data.ipynb / src/data/gen_ropg_data.py:
#   reader_kd mode    ->  data/ropg_kd/{train,val}.jsonl          (listwise scored)
#   hard_neg triplets ->  data/ropg_kd/{train,val}_triplets.jsonl
#   hard_neg pairs    ->  data/ropg_kd/{train,val}_pairs.jsonl
seed: 42
# hard_neg | reader_kd. reader_kd is retained as a documented ablation, not the primary
# arm: its teacher is a single-sample LLM-judge rating whose per-label reliability is
# ~0.17, and a listwise KL objective weights the whole graded ranking — including the
# middle, where adjacent teacher gaps (0.02-0.03) sit below that noise floor. MNRL reads
# only the rank-1 vs tail contrast (gap 0.711), which survives the same teacher.
# See docs/methodology.md, "Why reader_kd was retired".
mode: hard_neg
format: triplets          # triplets | pairs — only used when mode=hard_neg

data:
  # Selects the arm — see docs/experiment-design.md, "Stage-1 retriever runs".
  # Both directories are derived from the same judged {train,val}.jsonl and differ only
  # in whether the label filters ran (configs/datagen_ropg_filtered.yaml builds the
  # filtered one). Currently: run B.
  #   data/ropg_kd           filters OFF  (runs A, B)
  #   data/ropg_kd_filtered  filters ON   (runs C, D)
  train_data: data/ropg_kd  # directory; file names derive from mode + format
  corpus_path: data/chunks/corpus.jsonl  # ranked in full for Recall@K / MRR

embedder:
  model: Qwen/Qwen3-Embedding-0.6B
  # Must match the max_seq_length used when the FAISS index is built, or the same
  # chunk gets two different embeddings at train and serve time. At 2048 the p95
  # corpus chunk fits whole (~1.5k tokens); only the longest few still truncate.
  max_seq_length: 2048

training:
  device: cuda           # cpu for local smoke runs
  precision: fp16        # fp16 | bf16 | fp32 — T4/P100 have no bf16; A100+ do
  # Recompute activations in backward. Not a tunable on a 16 GB T4: without it a single
  # batch_size:1 step retains ~36 GB of activations (28 layers x ~43k tokens, ~30 KB per
  # token per layer in fp16); with it only each block's input is stored, ~2.5 GB. There is
  # no batch_size/doc_micro_batch pair that fits without it. Cost is one extra forward.
  gradient_checkpointing: true
  # Executed Luna-era runs selected best epoch 1 for B/C/D and 2 for A, out of 3. The
  # three-epoch budget captures overfitting without adding an unnecessary compute budget.
  epochs: 3
  batch_size: 2          # groups per optimizer step; effective batch = this x world_size.
                         # The knob for *retained* activation memory: one graph is held
                         # until backward, so stored activations scale with tokens per step
                         # and only this controls them. (It no longer drives padding waste -
                         # encode_chunked re-pads each micro-batch to its own width, so the
                         # collator's batch-wide padding is discarded before any forward.)
  doc_micro_batch: 10    # sequences per forward inside encode_chunked. Two distinct roles:
                         # (1) caps the *transient* per-forward working set - it does not
                         # reduce retained activations, since all micro-forwards stay in one
                         # graph; (2) sets padding tightness, because encode_chunked sorts by
                         # true length and trims each micro-batch to its own width. Role (2)
                         # dominates here: the median document is 167 tokens but the collator
                         # pads the batch to 2048, so unsorted chunking wastes ~65% of every
                         # FLOP. Measured on train.jsonl: 20 -> 1.68x faster, 10 -> 2.21x,
                         # 5 -> 2.54x. 10 takes nearly all the win while keeping launches
                         # large enough not to starve the GPU. 0 disables chunking entirely.
  # A full-FT rate (2e-5) under-trains an adapter, but 2e-4 over 1296 groups drove every
  # checkpoint *below* the untrained baseline — the signature of destructive drift rather
  # than of learning. 5e-5 keeps the adapter in adapter territory without that.
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  num_workers: 2
  # Student scores are cosine sims in [-1,1] and teacher scores lie in [0,1]. At
  # temperature 1.0 a softmax over 20 candidates is near-uniform on both sides and
  # the KD gradient is close to noise, so both are sharpened well below 1.
  student_temp: 0.05     # student/retriever softmax temp (also the MNRL temp in hard_neg)
  teacher_temp: 0.2      # teacher/gold softmax temp (reader_kd only)
  # Max hard negatives per query (hard_neg only). Must not exceed what
  # configs/datagen_ropg.yaml wrote into the triplet files: TripletDataset slices
  # negatives[:max_negatives], so a larger value here silently trains on fewer.
  # 4 -> 8 costs almost no signal (mean positive-negative gap 0.711 -> 0.686) and
  # doubles the terms in the MNRL softmax.
  max_negatives: 8
  max_documents: 20      # max docs per query (reader_kd mode only)

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: [q_proj, k_proj, v_proj, o_proj]

eval:
  top_k: 5               # matches inference retrieval.top_k; also the range of the
                         # nDCG@1..K and Hit@1..K curves reported each epoch
  relevance_top_m: 3     # binary relevant set = top-m docs by teacher_score per group.
                         # Drives Recall@K / Hit@K / MRR only - nDCG grades by the raw
                         # teacher_score and needs no cutoff. The boundary mostly splits
                         # near-ties (the rank-3 vs rank-4 gap is under 0.05 in 53% of val
                         # groups), which is why Recall@K is reported beside nDCG, not
                         # instead of it. Headline pair is nDCG@1 + Recall@K; nDCG@K is
                         # reported but no longer leads, because 53.4% of its mass sits in
                         # slots 2-5 where adjacent teacher gaps (0.049-0.075) are at the
                         # label noise floor. See docs/experiment-design.md, "Stage-1
                         # retriever runs".
                         # Note Recall@k divides by m, so Recall@1 is capped at 1/m -
                         # hence Recall is reported at K only, where the ceiling is 1.0.
  # Persona-mismatch (counterfactual swap) control. Re-scores every val query under a
  # rotated, valid persona different from the group's persona_id
  # (crammer→scholar→steady→crammer) against the same corpus embedding. "Mismatched"
  # means the substituted profile differs from the persona whose fixed,
  # persona-conditioned teacher labels are being evaluated; it does not mean that the
  # substituted persona is invalid. The raw query, corpus embedding, and labels stay
  # fixed, so only the `Instruct:` prefix changes. The matched-minus-swapped delta is
  # the personalisation signal in isolation. Under the Luna-era labels, this deliberate
  # mismatch costs 0.1363 nDCG@5. Cheap: the corpus embedding is reused and only 276
  # queries are re-encoded. Compare with `benchmarks/compare_runs.py --swap`.
  persona_swap: true
  eval_batch_size: 32    # corpus + val-query encoding only, and unrelated to batch_size:
                         # encode_texts is no-grad, so nothing is retained for backward and
                         # only the transient per-forward set exists. Runs on rank 0 once
                         # per epoch over a ~171-chunk corpus, so this is a minor cost.
  # Checkpoint rule is fixed: highest overall Recall@K, ties broken by lower val KD
  # loss, then higher MRR. Selecting on KD loss alone would reward an encoder that
  # matches the teacher while retrieving worse.

# Base-model anchoring (hard_neg only). Penalises drift from the pretrained Qwen3
# embedding, because the observed failure is that training moves the encoder *away* from
# a baseline it never beats. Reference embeddings come from the same weights with the
# LoRA adapter switched off, cached once at startup (~1.5k distinct texts), so the
# regulariser costs no extra forward per step.
anchor:
  # none       — plain MNRL, the unanchored control arm
  # both       — penalise drift on the query and document towers, weighted separately
  # doc_frozen — encode documents with the adapter off entirely: an asymmetric
  #              bi-encoder. Well motivated because Qwen3-Embedding is already used
  #              asymmetrically (queries carry the `Instruct:` prefix, documents do not).
  #              NOTE: this changes the serving contract — the FAISS index must then be
  #              built with the adapter off, and only queries get the adapter. Do not
  #              ship a doc_frozen checkpoint without rebuilding the index that way.
  mode: both
  # Two lambdas, not one. Personalisation is a property of the *query* side only —
  # documents carry no persona — so the document tower should barely move while the query
  # tower is where persona conditioning has to live. Ignored when mode is none, and
  # lambda_doc is ignored under doc_frozen (the documents are already the base model).
  lambda_doc: 0.5
  lambda_query: 0.05

checkpoint_dir: data/rl/ropg_kd_checkpoints
