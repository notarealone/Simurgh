# Run C / D data arm: identical to configs/datagen_ropg.yaml except that the label
# filters are ON and the output lands in its own directory, so the filtered and
# unfiltered triplets coexist and each arm is reproducible from a config alone
# (CLAUDE.md: "phases are configs, not folders").
#
# The expensive artefact — the judged {train,val}.jsonl — is *shared*, not re-judged:
# copy it in once, then derive.
#
#     mkdir -p data/ropg_kd_filtered
#     cp data/ropg_kd/train.jsonl data/ropg_kd/val.jsonl data/ropg_kd_filtered/
#     python -m data.gen_ropg_data --config configs/datagen_ropg_filtered.yaml --derive-only
#
# Deriving takes seconds: no API calls, no model load. Upload one Kaggle dataset
# containing BOTH data/ropg_kd/ and data/ropg_kd_filtered/, then select the arm with
# `data.train_data` in configs/train_ropg.yaml.
#
# Note the retrieval eval set is unaffected. src/rl/ropg_kd.py loads its eval groups from
# `{train_data}/val.jsonl` — the *scored* file, which derive_triplets never rewrites — so
# all 276 val groups survive in both arms and the two are directly paired-comparable.
# `val_loss` is the one exception: a filtered arm computes it over fewer triplets.

embedder:
  model: Qwen/Qwen3-Embedding-0.6B
  device: cpu
  batch_size: 128
  # Must equal configs/train_ropg.yaml and index/serving settings;
  # candidate mining must use the same document/query truncation contract.
  max_seq_length: 2048

retriever:
  top_k: 20

judge:
  model: gpt-5.6-luna
  reasoning_effort: none
  temperature: 1.0
  max_completion_tokens: 16
  max_workers: 8
  # Retry API exceptions and malformed numeric responses with exponential, capped backoff;
  # exhaustion logs/skips the whole (question, persona) group instead of assigning score zero.
  max_attempts: 3
  initial_backoff_seconds: 1.0
  backoff_multiplier: 2.0
  max_backoff_seconds: 8.0

data:
  chunks: data/chunks/corpus.jsonl
  questions_dir: data/questions
  splits_dir: data/splits
  output_dir: data/ropg_kd_filtered

seed: 42

# Derivation of triplets/pairs from the scored data. This block is read
# by derive_triplets() and applies to *both* gen_ropg_data.py and the lazy re-derive
# inside src/rl/ropg_kd.py. None of it needs the judge: it re-reads the existing
# data/ropg_kd/{train,val}.jsonl, so changing anything here costs seconds, not API calls.
# The current derivation intentionally preserves the selection shared by Runs A and B:
# ranks 13-20 from the judged top 20, ordered from rank 13 to rank 20. These are not
# called hardest negatives.
triplets:
  # Negatives per group, selected as ranks 13-20 from the judged top 20 and ordered
  # from rank 13 to rank 20. This preserves the selection shared by Runs A and B.
  max_negatives: 8

  # The teacher (an LLM judge, see docs/methodology.md) has a single-label reliability
  # of roughly 0.17, so a large share of groups carry supervision that is noise rather
  # than signal. These drop the groups where that is measurable. Default off: the
  # unfiltered arm must stay reproducible from config alone.
  filters:
    # ON — train retains 929/1296 after 258 margin drops and 109 positive-score drops;
    # val retains 206/276 after 51 margin drops and 19 positive-score drops.
    enabled: true
    # Drop the group if rank-1 and rank-2 are within this. The margin filter drops
    # 258/1296 train groups and 51/276 validation groups in this build.
    min_positive_margin: 0.05
    # After the margin filter, the positive-score filter drops another 109 train groups
    # and 19 validation groups at this threshold.
    min_positive_score: 0.4
    # All retained rows have 8 negatives, so this negative margin removed none in this
    # build.
    min_negative_margin: 0.25
